name: Build and Release DNS Party

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Application and Installer
      run: .\build.bat --skip-tests
      shell: cmd

    - name: Calculate SHA-256 Checksums
      run: |
        $setupHash = (Get-FileHash "dist\DNSParty-Setup.exe" -Algorithm SHA256).Hash
        $portableHash = (Get-FileHash "dist\DNSParty-Portable.exe" -Algorithm SHA256).Hash

        "SHA256 Checksums:" | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding utf8
        "$setupHash *DNSParty-Setup.exe" | Out-File -FilePath "dist\SHA256SUMS.txt" -Append -Encoding utf8
        "$portableHash *DNSParty-Portable.exe" | Out-File -FilePath "dist\SHA256SUMS.txt" -Append -Encoding utf8
      shell: powershell

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/DNSParty-Setup.exe
          dist/DNSParty-Portable.exe
          dist/SHA256SUMS.txt
        name: DNS Party ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
