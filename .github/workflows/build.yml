name: Build DNS Party

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Application
      run: msbuild src/DNSParty/DNSParty.csproj /p:Configuration=Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DNSParty-Release
        path: src/DNSParty/obj/Release/DNSParty.exe
